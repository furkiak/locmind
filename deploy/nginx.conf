# Optional: nginx in front of Locmind (TLS termination on 443).
# Start Locmind with TRUST_PROXY=1 so bans and rate limits see the real visitor address.
# The TURN ports (3478 udp/tcp, 5349 tcp, 49160-49359 udp) go straight to Locmind, not through nginx.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name locmind.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name locmind.example.com;

    ssl_certificate     /etc/letsencrypt/live/locmind.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/locmind.example.com/privkey.pem;

    client_max_body_size 30m;            # song uploads (UPLOAD_MAX_MB + headroom)

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 120s;          # the WebSocket is pinged every 25 seconds
        proxy_buffering off;
    }
}
