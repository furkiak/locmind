name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Unit and integration (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # nothing is installed on purpose: the server must run on Node.js alone
      - name: No runtime dependencies
        run: node -e "const d = require('./package.json').dependencies || {}; if (Object.keys(d).length) { console.error('runtime dependencies found:', d); process.exit(1); }"
      - run: npm test
      - name: Load test smoke run
        run: node scripts/bench.mjs --stages 50,150 --duration 6

  e2e:
    name: Browser end-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright-core install --with-deps chromium
      - run: npm run test:e2e

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t locmind:ci .
      - name: Boots and answers health checks
        run: |
          docker run -d --name locmind -p 3000:3000 locmind:ci
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:3000/healthz && exit 0; sleep 1; done
          docker logs locmind; exit 1
