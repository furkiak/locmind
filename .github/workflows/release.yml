name: Release

# Pushing a version tag (for example v3.0.0) tests the server, publishes a multi-architecture Docker image to
# ghcr.io/<owner>/locmind (tags: 3.0.0, 3.0, 3, latest) and creates a GitHub release with the CHANGELOG section.

on:
  push:
    tags: [ "v*" ]

permissions:
  contents: write
  packages: write

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: The tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"; exit 1; }
      - run: npm test

  image:
    name: Docker image
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/locmind
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=Locmind
            org.opencontainers.image.description=A self-hosted 2D virtual universe with proximity voice, video, rooms and shared tools. Zero runtime dependencies.

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: The published image boots
        run: |
          image="ghcr.io/${{ github.repository_owner }}/locmind:${GITHUB_REF_NAME#v}"
          docker run -d --name locmind -p 3000:3000 "$image"
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:3000/healthz && exit 0; sleep 1; done
          docker logs locmind; exit 1

  release:
    name: GitHub release
    needs: image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '$0 ~ "^## "v"( |$)" {found=1; next} found && /^## / {exit} found {print}' CHANGELOG.md > section.md
          [ -s section.md ] || { echo "::error::CHANGELOG.md has no '## $version' section"; exit 1; }
          {
            echo "**Docker:** \`docker run -d --network host -v locmind-data:/data ghcr.io/${{ github.repository_owner }}/locmind:$version\` · **From source:** \`git clone https://github.com/${{ github.repository }}.git && cd locmind && node server.js\` (Node.js 20+, nothing to install)."
            echo
            cat section.md
          } > notes.md
          gh release create "$GITHUB_REF_NAME" --title "Locmind $version" --notes-file notes.md
